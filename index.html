/* ===== CORE: pure logic, amounts in cents ===== */
const KINDS={achat:"Achat",rembours:"Remboursement / crédit",frais:"Frais",interets:"Intérêts",paiement:"Paiement de carte",epargne:"Transfert d'épargne",revenu:"Revenu / paie"};
const DEFAULT_CATS=[

const RULES=[
 ["Épicerie",/\b(iga|metro|maxi|provigo|loblaw|super ?c|adonis|costco(?! gas)|sobeys|farm ?boy|food ?basics|giant tiger|no ?frills|walmart|rachelle|avril|marché)\b/i],

function merchantKey(m){return String(m||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/#?\d{3,}/g,"").replace(/[^a-z0-9& ]+/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ")}
function categorize(merchant,learned){const k=merchantKey(merchant);if(learned){if(learned[k])return learned[k];const f=Object.keys(learned).find(x=>x&&(k.startsWith(x)||x.startsWith(k)));if(f)return learned[f]}for(const[c,r]of RULES)if(r.test(merchant))return c;return"Divers"}
function guessKind(desc,signNeg){const d=String(desc).toLowerCase();if(/paiement.*(merci|re[çc]u)|payment.*(thank|received)|^paiement$|pmt recu/.test(d))return"paiement";if(/int[ée]r[êe]ts?|interest|frais d.int/.test(d))return"interets";if(/\bfrais\b|\bfee\b|annual fee|cotisation annuelle/.test(d))return"frais";if(signNeg)return"rembours";return"achat"}
/* cents */
function toCents(v){if(typeof v==="number")return Math.round(v*100);let s=String(v).trim();const neg=/^-|\(.*\)|-$|\bCR\b/i.test(s);s=s.replace(/[^\d,.]/g,"");if(!s)return NaN;const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");let dec=-1;if(lc>ld&&s.length-lc-1===2)dec=lc;else if(ld>lc&&s.length-ld-1===2)dec=ld;else if(lc>ld&&s.length-lc-1!==3)dec=lc;else if(ld>lc&&s.length-ld-1!==3)dec=ld;let i,f="00";if(dec>=0){i=s.slice(0,dec);f=(s.slice(dec+1)+"00").slice(0,2)}else i=s;i=i.replace(/[,.]/g,"");const c=parseInt(i||"0",10)*100+parseInt(f,10);return neg?-c:c}

 return`<div class="top"><span></span>${monthNav()}</div><h1>Budget</h1>
 <div class="hero"><div class="row2"><div><div class="kl">Prévu</div><div class="kv">${fmtC(totalB)}</div></div><div><div class="kl">Réel (net)</div><div class="kv" style="color:${st.net>totalB&&totalB?"var(--bad)":"var(--fg)"}">${fmtC(st.net)}</div></div></div>
 <div class="sub">Écart : <b style="color:${totalB-st.net<0?"var(--bad)":"var(--good)"}">${fmtC(totalB-st.net)}</b>${inc?` · revenus prévus ${fmtC(inc)}/mois · non budgété ${fmtC(inc-totalB)}`:""}</div></div>
 <h3>Scénario</h3><div class="seg">${[["prudent","Prudent"],["realiste","Réaliste"],["ambitieux","Ambitieux"]].map(([k,l])=>`<button class="${cfg.scenario===k?"on":""}" data-act="scen" data-k="${k}">${l}</button>`).join("")}</div>
 <p class="note">Prudent laisse plus de marge, Ambitieux réduit les dépenses pour épargner plus. Calculé sur tes 3 derniers mois (ou tes revenus si tu débutes). Ajustable ensuite catégorie par catégorie.</p>
 <h3>Par catégorie · prévu / réel / écart</h3><div class="group">${cfg.cats.map(c=>{const b=budgetFor(c.name),sp=st.byCat[c.name]||0,p=b?sp/b:0;return`<button class="cell" data-act="setbud" data-c="${esc(c.name)}">${catIco(c.name)}<span class="main"><b>${esc(c.name)}</b><small class="num">${fmtC(sp)} / ${b?fmtC(b):"—"}${sm[c.name]?" · dont "+fmtC(sm[c.name])+" lissé":""}</small>${b?`<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${p>1?"var(--bad)":p>=.8?"var(--warn)":catColor(c.name)}"></i></div>`:""}</span><span class="val" style="color:${b&&b-sp<0?"var(--bad)":"var(--mute)"}">${b?fmtC(b-sp):"Définir"}</span></button>`}).join("")}</div>
 <h3>Dépenses irrégulières lissées</h3><div class="group">${cfg.irregular.map(i=>`<button class="cell" data-act="irr" data-id="${i.id}"><span class="main"><b>${esc(i.name)}</b><small>${esc(i.cat)} · ${fmtC(i.annualCents)}/an</small></span><span class="val">${fmtC(Math.round(i.annualCents/12))}/mois</span></button>`).join("")}<button class="cell" data-act="irr" style="color:var(--accent)">+ Ajouter (ex. assurance annuelle, cadeaux de Noël)</button></div>`};

VIEWS.pay=()=>{const p=cfg.pay,today=TODAY();if(!p.netCents||!p.firstDate)return topbar("Ma paie")+`<div class="empty">Ta paie n'est pas encore configurée.</div><button class="btn" data-act="editpay">Configurer ma paie</button>`;
 const next=payDates(p,today,addDays(today,120)).slice(0,6),y=today.getFullYear(),three=threePayMonths(p,y),threeNext=threePayMonths(p,y+1),split=next[0]?paySplit(cfg,txs,next[0]):null;const mn=m=>new Date(2000,m-1,1).toLocaleDateString("fr-CA",{month:"long"});
 return topbar("Ma paie",`<button class="tbtn" data-act="editpay">Modifier</button>`)+`<div class="hero"><div class="kl">Prochaine paie · ${next[0]?fmtD(next[0]):"—"}</div><div class="big num">${fmtC(p.netCents)}</div><div class="sub">${{biweekly:"Aux deux semaines",semimonthly:"Deux fois par mois",monthly:"Mensuelle"}[p.freq]} · environ ${fmtC(monthlyIncomeEstimate(p))} par mois</div></div>
 ${split?`<h3>Répartition proposée de cette paie</h3><div class="hero"><canvas id="c-split" height="26"></canvas><div class="gap" style="margin-top:12px">${[["Charges fixes avant la prochaine paie",split.fixed,"var(--mute)"],["Épargne",split.save,"var(--good)"],["Dépenses courantes",split.cur,"var(--accent)"]].map(([l,v,c])=>`<div style="display:flex;justify-content:space-between;gap:10px"><span style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></i>${l}</span><b class="num">${fmtC(v)}</b></div>`).join("")}</div>${split.cur<0?`<p class="note" style="color:var(--bad)">Cette paie ne couvre pas les charges prévues : il manque ${fmtC(-split.cur)}.</p>`:""}
 <div class="inl" style="padding:12px 0 0"><span>Part épargnée par paie</span><select id="saverate">${[0,.05,.1,.15,.2,.25,.3].map(r=>`<option value="${r}" ${Math.abs((cfg.saveRate??.15)-r)<.001?"selected":""}>${r*100} %</option>`).join("")}</select></div></div>`:""}
 <h3>Prochaines paies</h3><div class="group">${next.map(d=>{const m=+d.slice(5,7),isThird=three.includes(m)&&payDates(p,new Date(+d.slice(0,4),m-1,1),parseISO(d)).length===3;return`<div class="cell"><span class="main"><b>${parseISO(d).toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"})}</b>${isThird?`<small>3ᵉ paie du mois</small>`:""}</span><span class="val" style="color:var(--good)">+${fmtC(p.netCents)}</span></div>`}).join("")}</div>
 ${p.freq==="biweekly"?`<h3>Mois à trois paies</h3><div class="group"><div class="cell"><span class="main"><b>${y} : ${three.map(mn).join(" et ")||"aucun"}</b><small>${y+1} : ${threeNext.map(mn).join(" et ")||"aucun"}</small></span></div></div><p class="note">Ces mois-là, une paie entière est « en plus » de ton budget mensuel : idéal pour l'épargne ou une dépense prévue.</p>`:""}`};

VIEWS.more=()=>{const rows=[["calendar","Calendrier et dépenses à venir","var(--warn)","▦"],["goals","Objectifs et projections","var(--good)","◎"],["reports","Rapports et graphiques","var(--save)","▥"],["import","Import de relevés","var(--accent)","⇣"],["wallet","Apple Pay","#111","▭"],["cats","Catégories","#8e44ad","◆"],["alerts","Alertes budgétaires","var(--bad)","!"]],rows2=[["settings","Réglages","var(--mute)","⚙"],["backup","Sauvegarde et export","var(--mute)","⇪"],["tests","Vérification des calculs","var(--mute)","✓"]];
 const li=r=>`<button class="cell chev" data-act="go" data-v="${r[0]}"><span class="ico" style="background:${r[2]}">${r[3]}</span><span class="main"><b>${r[1]}</b></span></button>`;
 return topbar("Plus")+`<div class="group">${rows.map(li).join("")}</div><h3></h3><div class="group">${rows2.map(li).join("")}</div>`};

VIEWS.calendar=()=>{const[y,m]=S.calMonth.split("-").map(Number),first=new Date(y,m-1,1),start=addDays(first,-((first.getDay()+6)%7)),today=TODAY();
 const ev={};const add=(d,type,label,c)=>(ev[d]=ev[d]||[]).push({type,label,c});payDates(cfg.pay,start,addDays(start,41)).forEach(d=>add(d,"pay","Paie",cfg.pay.netCents));
 for(let i=0;i<42;i++){const d=addDays(start,i),ds=isoD(d);cfg.bills.forEach(b=>b.day===d.getDate()&&add(ds,"bill",b.name+(b.toConfirm?" (à confirmer)":""),b.cents));cfg.cards.filter(c=>c.kind==="credit"&&c.dueDay===d.getDate()).forEach(c=>add(ds,"card","Paiement "+c.name,null))}
 cfg.planned.forEach(p=>add(p.date,"planned",p.name,p.cents));const colr={pay:"var(--good)",bill:"var(--mute)",card:"var(--save)",planned:"var(--warn)"};
 const sim=simulateCash(cfg,txs,today,60),sel=S.calSel,selEv=ev[sel]||[],simPt=sim.pts.find(p=>p.date===sel);
 return topbar("Calendrier")+`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="tbtn" data-act="cprev">‹</button><b style="text-transform:capitalize">${monthLabel(S.calMonth)}</b><button class="tbtn" data-act="cnext">›</button></div>
 <div class="cal">${["L","M","M","J","V","S","D"].map(h=>`<div class="h">${h}</div>`).join("")}${Array.from({length:42},(_,i)=>{const d=addDays(start,i),ds=isoD(d),e=ev[ds]||[];return`<button class="d ${d.getMonth()!==m-1?"out":""} ${ds===todayIso()?"today":""} ${ds===sel?"sel":""}" data-act="csel" data-d="${ds}">${d.getDate()}<span class="dots">${[...new Set(e.map(x=>x.type))].map(t=>`<i style="background:${colr[t]}"></i>`).join("")}</span></button>`}).join("")}</div>
 <div class="legend"><span><i style="background:var(--good)"></i>Paie</span><span><i style="background:var(--mute)"></i>Facture</span><span><i style="background:var(--save)"></i>Carte</span><span><i style="background:var(--warn)"></i>Prévu</span></div>
 <h3>${fmtD(sel)}</h3><div class="group">${selEv.length?selEv.map(e=>`<div class="cell"><span class="main"><b>${esc(e.label)}</b></span>${e.c!=null?`<span class="val">${e.type==="pay"?"+":"−"}${fmtC(e.c)}</span>`:""}</div>`).join(""):`<div class="cell"><small>Rien de prévu ce jour-là.</small></div>`}${simPt?`<div class="cell"><span class="main"><small>Solde courant simulé</small></span><span class="val" style="color:${simPt.bal<cfg.cushionCents?"var(--bad)":"var(--fg)"}">${fmtC(simPt.bal)}</span></div>`:""}</div>
 ${cfg.accounts.some(a=>a.type==="courant")?`<h3>Trésorerie simulée · 60 jours</h3><div class="hero"><canvas id="c-cash" height="180"></canvas><p class="note" style="margin:8px 0 0">Coussin de sécurité ${fmtC(cfg.cushionCents)} (pointillé). Dépenses courantes estimées ${fmtC(sim.daily)}/jour.${sim.under?` <b style="color:var(--bad)">Passage sous le coussin prévu le ${fmtD(sim.under.date)}.</b>`:""}</p></div>`:`<p class="note">Ajoute ton compte courant et son solde dans Réglages pour voir la trésorerie jour par jour.</p>`}
 <h3>Dépenses futures prévues</h3><div class="group">${cfg.planned.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<button class="cell" data-act="planned" data-id="${p.id}"><span class="main"><b>${esc(p.name)}</b><small>${fmtD(p.date)} · ${esc(p.cat)}</small></span><span class="val">${fmtC(p.cents)}</span></button>`).join("")}<button class="cell" data-act="planned" style="color:var(--accent)">+ Ajouter une dépense prévue</button></div>`};

VIEWS.goals=()=>{const today=TODAY(),avg=avgMonthlySavings(txs,today);
 return topbar("Objectifs",`<button class="tbtn" data-act="goal">Ajouter</button>`)+`<div class="hero"><div class="kl">Épargne moyenne (3 derniers mois)</div><div class="big num">${fmtC(avg)}<span style="font-size:18px;color:var(--mute)"> /mois</span></div><canvas id="c-proj" height="170" style="margin-top:12px"></canvas>
 <div class="kpis">${[3,6,12].map(n=>`<div><div class="kl">Dans ${n} mois</div><div class="kv" style="color:var(--save)">+${fmtC(avg*n)}</div></div>`).join("")}</div></div>
 <h3>Mes objectifs</h3>${cfg.goals.length?`<div class="group">${cfg.goals.map(g=>{const s=goalSaved(g,txs),p=g.targetCents?s/g.targetCents:0,months=g.date?Math.max(1,(parseISO(g.date).getFullYear()-today.getFullYear())*12+parseISO(g.date).getMonth()-today.getMonth()):null,need=months?Math.max(0,Math.ceil((g.targetCents-s)/months)):null;return`<button class="cell" data-act="goal" data-id="${g.id}"><span class="main"><b>${esc(g.name)}</b><small class="num">${fmtC(s)} / ${fmtC(g.targetCents)}${g.date?" · "+fmtD(g.date):""}${need!=null&&p<1?" · "+fmtC(need)+"/mois requis":""}</small><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${p>=1?"var(--good)":"var(--save)"}"></i></div></span><span class="val">${Math.round(p*100)} %</span></button>`}).join("")}</div><p class="note">Pour alimenter un objectif : ajoute une transaction de type « Transfert d'épargne » et choisis l'objectif.</p>`:`<div class="empty">Aucun objectif. Ajoute un fonds d'urgence, un voyage ou une mise de fonds.</div>`}`};

VIEWS.reports=()=>{const mk=S.month,st=monthStats(txs,mk),pst=monthStats(txs,shiftMonth(mk,-1)),an=anomalies(txs,mk);const cats=Object.entries(st.byCat).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const merch=Object.values(st.byMerchant).sort((a,b)=>b.cents-a.cents).slice(0,8);
 const varPct=pst.net?Math.round((st.net-pst.net)/pst.net*100):null;const recos=[];
 Object.keys(cfg.budgets).forEach(c=>{if(budgetFor(c)&&(st.byCat[c]||0)>budgetFor(c))recos.push(`Réduis « ${c} » : ${fmtC((st.byCat[c]||0)-budgetFor(c))} au-dessus du budget.`)});
 if(st.rate!==null&&st.rate<.2)recos.push(`Ton taux d'épargne est de ${Math.round(st.rate*100)} %. Viser 20 % représenterait ${fmtC(Math.round(st.income*.2-(st.income-st.net)))} de plus par mois.`);
 if(st.fees+st.interest)recos.push(`Tu as payé ${fmtC(st.fees+st.interest)} de frais et d'intérêts : paie le solde complet de ta carte à l'échéance.`);
 const subs=st.byCat["Abonnements"]||0;if(subs>5000)recos.push(`Tes abonnements coûtent ${fmtC(subs)} ce mois-ci (${fmtC(subs*12)}/an). Vérifie ceux que tu n'utilises plus.`);
 return`<div class="top">${S.stack.length?`<button class="back" data-act="back">‹ Retour</button>`:"<span></span>"}${monthNav()}</div><h1>Rapports</h1>
 <h3>Synthèse du mois</h3><div class="group">${[["Achats bruts",st.gross],["Remboursements et crédits",-st.refunds],["Dépenses nettes",st.net,1],["Frais",st.fees],["Intérêts",st.interest],["Revenus",st.income],["Épargne transférée",st.savings]].map(([l,v,b])=>`<div class="cell"><span class="main">${b?"<b>"+l+"</b>":l}</span><span class="val" style="${b?"font-weight:700":""}">${fmtC(v)}</span></div>`).join("")}
 <div class="cell"><span class="main">Variation vs mois précédent</span><span class="val" style="color:${varPct>0?"var(--bad)":"var(--good)"}">${varPct===null?"—":(varPct>0?"+":"")+varPct+" %"}</span></div><div class="cell"><span class="main">Taux d'épargne</span><span class="val">${st.rate===null?"—":Math.round(st.rate*100)+" %"}</span></div></div>
 <h3>Dépenses par catégorie</h3><div class="hero">${cats.length?`<canvas id="c-donut" height="210"></canvas><div class="legend">${cats.map(([c,v])=>`<span><i style="background:${catColor(c)}"></i>${esc(c)} ${Math.round(v/st.net*100)} %</span>`).join("")}</div>`:`<div class="empty">Aucune dépense ce mois-ci.</div>`}</div>
 <h3>Évolution sur 6 mois</h3><div class="hero"><canvas id="c-bars" height="190"></canvas><div class="legend"><span><i style="background:var(--good)"></i>Revenus</span><span><i style="background:var(--bad)"></i>Dépenses nettes</span><span><i style="background:var(--save)"></i>Épargne</span></div></div>
 <h3>Principaux commerçants</h3><div class="group">${merch.length?merch.map(x=>`<div class="cell"><span class="main"><b>${esc(x.name)}</b></span><span class="val">${fmtC(x.cents)}</span></div>`).join(""):`<div class="cell"><small>—</small></div>`}</div>
 <h3>Contrôle des anomalies</h3><div class="group">${an.dupes.map(([a,b])=>`<button class="cell" data-act="edit" data-id="${b.id}"><span class="pill p-warn">Doublon ?</span><span class="main"><b>${esc(b.merchant)}</b><small>${fmtD(b.date)}</small></span><span class="val">${fmtC(b.cents)}</span></button>`).join("")}${an.unusual.map(t=>`<button class="cell" data-act="edit" data-id="${t.id}"><span class="pill p-bad">Inhabituel</span><span class="main"><b>${esc(t.merchant)}</b><small>${esc(t.cat)} · ${fmtD(t.date)}</small></span><span class="val">${fmtC(t.cents)}</span></button>`).join("")}${an.fees.map(t=>`<button class="cell" data-act="edit" data-id="${t.id}"><span class="pill p-mute">${KINDS[t.kind]}</span><span class="main"><b>${esc(t.merchant)}</b><small>${fmtD(t.date)}</small></span><span class="val">${fmtC(t.cents)}</span></button>`).join("")}${!an.dupes.length&&!an.unusual.length&&!an.fees.length?`<div class="cell"><span class="pill p-good">OK</span><span class="main"><small>Aucune anomalie détectée.</small></span></div>`:""}</div>
 <h3>Recommandations</h3><div class="group">${(recos.length?recos:["Rien à signaler : continue comme ça."]).map(r=>`<div class="cell"><span class="main" style="white-space:normal;line-height:1.4">${esc(r)}</span></div>`).join("")}</div>`};

VIEWS.import=()=>{const r=S.review;if(r)return reviewView(r);
 return topbar("Import de relevés")+`<div class="group"><label class="cell chev" for="file"><span class="ico" style="background:var(--accent)">⇣</span><span class="main"><b>Choisir un fichier</b><small>CSV, Excel (XLSX) ou PDF de relevé</small></span></label><input type="file" id="file" accept=".csv,.txt,.xlsx,.xls,.pdf,text/csv,application/pdf" hidden></div>
 <h3>Ou coller le texte du relevé</h3><div class="group"><div class="field"><textarea id="pastetxt" placeholder="02/11/2026  IGA EXTRA GATINEAU   123,45"></textarea></div></div><div style="margin-top:10px"><button class="btn" data-act="parsepaste">Analyser le texte</button></div>
 <h3>Historique des imports</h3><div class="group">${cfg.imports.length?cfg.imports.slice().reverse().map(i=>`<div class="cell"><span class="main"><b>${esc(i.source)}</b><small>${new Date(i.at).toLocaleDateString("fr-CA")} · ${i.count} ligne${i.count>1?"s":""}${i.undone?" · annulé":""}</small></span>${i.undone?"":`<button class="chip" data-act="undoimp" data-id="${i.id}">Annuler</button>`}</div>`).join(""):`<div class="cell"><small>Aucun import pour l'instant.</small></div>`}</div>`};
function reviewView(r){const n=r.rows.filter(x=>x.on).length;const accOpts=[...cfg.cards,...cfg.accounts];
 return`<div class="top"><button class="back" data-act="cancelrev">‹ Annuler</button><span class="mini">${esc(r.source)}</span></div><h1>Révision</h1>
 <div class="group"><div class="inl"><span>Compte ou carte</span><select id="revacc"><option value="">—</option>${accOpts.map(a=>`<option value="${a.id}" ${r.acc===a.id?"selected":""}>${esc(a.name)}${a.last4?" •"+a.last4:""}</option>`).join("")}</select></div></div>
 <p class="note">${r.rows.length} lignes lues · ${r.rows.filter(x=>x.dup).length} doublon(s) décoché(s). Touche une catégorie pour la changer : l'app retiendra le commerçant.</p>
 <div class="group" style="margin-top:10px">${r.rows.map((x,i)=>`<div class="cell" style="align-items:flex-start"><input type="checkbox" data-act="revtog" data-i="${i}" ${x.on?"checked":""} style="width:22px;height:22px;margin-top:4px;accent-color:var(--accent)" aria-label="Inclure"><span class="main"><b>${esc(x.merchant)}</b><small>${fmtD(x.date)}${x.dup?' · <span style="color:var(--warn)">doublon possible</span>':""}</small>
  <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><select data-act="revkind" data-i="${i}" style="font-size:13px;width:auto;background:var(--fill);border-radius:8px;padding:4px 8px">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${x.kind===k?"selected":""}>${v}</option>`).join("")}</select>${["achat","rembours"].includes(x.kind)?`<select data-act="revcat" data-i="${i}" style="font-size:13px;width:auto;background:var(--fill);border-radius:8px;padding:4px 8px">${cfg.cats.map(c=>`<option ${x.cat===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`:""}</div></span><span class="val">${fmtC(x.cents)}</span></div>`).join("")}</div>
 <div style="position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:12px"><button class="btn" data-act="commitimp" ${n?"":"disabled"}>Importer ${n} transaction${n>1?"s":""}</button></div>`}

VIEWS.wallet=()=>{const fmt="MF1;[Date formatée];[Montant];[Marchand];[Carte];END";
 return topbar("Apple Pay")+`<div class="banner b-info"><span>●</span><span>Chaque paiement Apple Pay est ajouté en silence dans un fichier de ton iPhone. Ici, un seul tap l'importe : tout arrive déjà classé, sans doublon.${cfg.lastWallet?" Dernier import : "+new Date(cfg.lastWallet).toLocaleDateString("fr-CA")+".":""}</span></div>
 <div class="group"><label class="cell chev" for="walletfile"><span class="ico" style="background:#111">${svgI(ICONS._paiement)}</span><span class="main"><b>Importer mes paiements Apple Pay</b><small>Choisis « MesFinances-ApplePay.txt » dans iCloud Drive › Raccourcis</small></span></label><input type="file" id="walletfile" accept=".txt,text/plain" hidden></div>
 <h3>Configuration · une seule fois</h3><div class="group"><ol class="steps">
 <li>App <b>Raccourcis</b> → onglet <b>Automatisation</b> → <b>+</b> → <b>Transaction</b>.</li>
 <li>Choisis tes cartes, coche « Lorsque je touche », puis <b>Exécuter immédiatement</b> → <b>Nouvelle automatisation vide</b>.</li>
 <li>Ajoute l'action <b>Date actuelle</b>, puis <b>Formater la date</b> : format personnalisé <code>yyyy-MM-dd'T'HH:mm:ss</code>.</li>
 <li>Ajoute l'action <b>Texte</b> et écris exactement la ligne ci-dessous, en remplaçant chaque [ ] par la variable du raccourci (Date formatée, puis Montant, Marchand et Carte de l'entrée Transaction).</li>
 <li>Ajoute l'action <b>Ajouter au fichier texte</b> : fichier <code>MesFinances-ApplePay.txt</code>, coche « Créer une ligne ».</li>
 <li>Ajoute <b>Afficher une notification</b> : « [Montant] · [Marchand] ».</li></ol></div>
 <pre id="wfmt">${esc(fmt)}</pre><button class="btn ghost" data-act="copy" data-t="wfmt" style="margin-top:8px">Copier la ligne</button>
 <h3>Carte par défaut</h3><div class="group"><div class="inl"><span>Si la carte n'est pas reconnue</span><select id="walletcard"><option value="">—</option>${cfg.cards.map(c=>`<option value="${c.id}" ${cfg.walletCard===c.id?"selected":""}>${esc(c.name)}${c.last4?" •"+c.last4:""}</option>`).join("")}</select></div></div>

const WIZ=["Bienvenue","Ta paie","Comptes et cartes","Charges fixes","Premier budget"];
function wizard(){const s=S.wiz,dots=`<div class="wiz-dots">${WIZ.map((_,i)=>`<i class="${i===s?"on":""}"></i>`).join("")}</div>`;let body="";
 if(s===0)body=`<h1>Bienvenue</h1><p class="sub" style="font-size:16px">Tout reste dans ton iPhone et fonctionne sans Internet. Cinq étapes rapides pour configurer ton budget. Tu peux sauter chaque étape et la reprendre plus tard dans Réglages.</p><h3>Ton prénom</h3><div class="group"><div class="field"><input id="w-name" value="${esc(cfg.name)}" placeholder="Moi"></div></div><div style="margin-top:22px"><button class="btn ghost" data-act="demo">Essayer avec des données d'exemple</button><p class="note" style="text-align:center">3 mois fictifs pour tester. Tu pourras tout effacer d'un tap.</p></div>`;
 if(s===1)body=`<h1>Ta paie</h1><div class="group"><div class="inl"><span>Fréquence</span><select id="w-freq">${[["biweekly","Aux deux semaines"],["semimonthly","Deux fois par mois"],["monthly","Mensuelle"]].map(([k,l])=>`<option value="${k}" ${cfg.pay.freq===k?"selected":""}>${l}</option>`).join("")}</select></div><div class="inl"><span>Montant net</span><input id="w-net" type="number" inputmode="decimal" placeholder="0,00" value="${cfg.pay.netCents?cfg.pay.netCents/100:""}"></div><div class="inl"><span>Prochaine paie</span><input id="w-first" type="date" value="${cfg.pay.firstDate||""}"></div></div>`;
 if(s===2)body=`<h1>Comptes et cartes</h1><p class="sub">Nom, 4 derniers chiffres seulement, et solde à une date donnée.</p><h3>Comptes</h3><div class="group">${cfg.accounts.map(a=>`<button class="cell" data-act="account" data-id="${a.id}"><span class="main"><b>${esc(a.name)}</b></span><span class="val">${fmtC(a.balanceCents)}</span></button>`).join("")}<button class="cell" data-act="account" style="color:var(--accent)">+ Compte courant</button></div><h3>Cartes de débit</h3><div class="group">${cfg.cards.map(c=>`<button class="cell" data-act="card" data-id="${c.id}"><span class="main"><b>${esc(c.name)} ${c.last4?"•"+esc(c.last4):""}</b></span></button>`).join("")}<button class="cell" data-act="card" style="color:var(--accent)">+ Carte de débit</button></div>`;
 if(s===3)body=`<h1>Charges fixes</h1><p class="sub">Loyer, assurances, téléphone, abonnements : montant et jour du mois.</p><div class="group" style="margin-top:12px">${cfg.bills.map(b=>`<button class="cell" data-act="bill" data-id="${b.id}"><span class="main"><b>${esc(b.name)}</b><small>le ${b.day}</small></span><span class="val">${fmtC(b.cents)}</span></button>`).join("")}<button class="cell" data-act="bill" style="color:var(--accent)">+ Ajouter une charge</button></div>`;
 if(s===4)body=`<h1>Premier budget</h1><p class="sub">Choisis un point de départ, tu l'ajusteras par catégorie.</p><div class="group" style="margin-top:12px">${[["prudent","Prudent","Plus de marge pour les imprévus"],["realiste","Réaliste","Proche de tes habitudes"],["ambitieux","Ambitieux","Dépenser moins, épargner plus"]].map(([k,l,d])=>`<button class="cell" data-act="scen" data-k="${k}"><span class="main"><b>${l}</b><small>${d}</small></span>${cfg.scenario===k?`<span style="color:var(--accent);font-weight:700">✓</span>`:""}</button>`).join("")}</div><p class="note">Tu pourras ensuite importer tes premiers relevés depuis Plus → Import.</p>`;
 return`<div class="top"><span class="mini">Étape ${s+1} sur 5</span><button class="tbtn" data-act="wskip" style="font-weight:400">Passer</button></div>${dots}${body}<div class="gap" style="margin-top:22px"><button class="btn" data-act="wnext">${s===4?"Terminer":"Continuer"}</button>${s>0?`<button class="btn ghost" data-act="wprev">Retour</button>`:""}</div>`}
function wizSave(){const s=S.wiz;if(s===0)cfg.name=($("w-name")||{}).value?.trim()||"";if(s===1){cfg.pay.freq=$("w-freq").value;cfg.pay.netCents=Math.max(0,toCents($("w-net").value||"0"));cfg.pay.firstDate=$("w-first").value}saveCfg()}

/* ---------- sheets ---------- */
function openSheet(title,html,onMount,right){$("layer").innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sheet-h"><button class="tbtn" style="font-weight:400" data-act="close">Annuler</button><b>${esc(title)}</b>${right||'<span style="width:60px"></span>'}</div>${html}</div>`;onMount&&onMount()}
function closeSheet(){$("layer").innerHTML=""}
function txSheet(t){const isNew=!t;t=t?JSON.parse(JSON.stringify(t)):{kind:"achat",date:todayIso(),cents:0,merchant:"",cat:"",accountId:cfg.cards[0]?.id||cfg.accounts[0]?.id||""};let splits=t.splits?[...t.splits]:[];
 const accOpts=sel=>`<option value="">—</option><option value="cash" ${sel==="cash"?"selected":""}>Espèces (cash)</option>${[...cfg.cards,...cfg.accounts].map(a=>`<option value="${a.id}" ${sel===a.id?"selected":""}>${esc(a.name)}${a.last4?" •"+a.last4:""}</option>`).join("")}`;
 const draw=()=>{const k=t.kind,sp=k==="achat"||k==="rembours";openSheet(isNew?"Nouvelle transaction":"Transaction",`
 <div class="seg" id="tk" style="margin-bottom:4px">${[["achat","Achat"],["rembours","Rembours."],["revenu","Revenu"],["epargne","Épargne"],["frais","Frais"]].map(([v,l])=>`<button class="${k===v?"on":""}" data-k="${v}">${l}</button>`).join("")}</div>
 <div class="amt-in num" id="t-amtd" aria-live="polite"></div><input id="t-amt" type="hidden" value="${t.cents?(t.cents/100).toFixed(2):""}">
 <div class="kp" id="t-kp">${["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(x=>`<button type="button" data-k="${x}" aria-label="${x==="⌫"?"Effacer":x}">${x}</button>`).join("")}</div>
 <div class="group"><div class="field"><label for="t-m">${k==="revenu"?"Source":"Commerçant"}</label><input id="t-m" value="${esc(t.merchant)}" placeholder="${k==="revenu"?"Paie":"IGA, Winners…"}" autocomplete="off"></div>
 ${sp?`<div class="field"><label>Catégorie</label><div class="catgrid" id="t-cats">${cfg.cats.map(c=>`<button type="button" class="cg ${t.cat===c.name?"on":""}" data-c="${esc(c.name)}">${catIco(c.name)}<span>${esc(c.name)}</span></button>`).join("")}</div></div>`:""}
 <div class="inl"><span>Date</span><input id="t-date" type="date" value="${t.date}"></div>
 ${k==="paiement"?`<div class="inl"><span>Carte payée</span><select id="t-acc">${accOpts(t.accountId)}</select></div><div class="inl"><span>Depuis</span><select id="t-from">${accOpts(t.fromId)}</select></div>`:k==="epargne"?`<div class="inl"><span>Depuis</span><select id="t-from">${accOpts(t.fromId)}</select></div><div class="inl"><span>Objectif</span><select id="t-goal"><option value="">—</option>${cfg.goals.map(g=>`<option value="${g.id}" ${t.goalId===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</select></div>`:`<div class="inl"><span>${k==="revenu"?"Compte":"Carte ou compte"}</span><select id="t-acc">${accOpts(t.accountId)}</select></div>`}
 <div class="field"><label for="t-note">Note</label><input id="t-note" value="${esc(t.note||"")}"></div></div>
 ${sp?`<h3>Répartition entre catégories</h3><div class="group" id="t-splits">${splits.map((s,i)=>`<div class="inl"><select data-si="${i}" class="s-cat" style="text-align:left;max-width:60%">${cfg.cats.map(c=>`<option ${s.cat===c.name?"selected":""}>${esc(c.name)}</option>`).join("")}</select><input data-si="${i}" class="s-amt" type="number" inputmode="decimal" value="${(s.cents/100).toFixed(2)}" style="max-width:35%"></div>`).join("")}<button class="cell" id="t-addsplit" style="color:var(--accent)">+ Répartir sur une autre catégorie</button></div>${splits.length?`<p class="note" id="t-splitsum"></p>`:""}`:""}
 <div class="gap" style="margin-top:14px"><button class="btn" id="t-save">${isNew?"Ajouter":"Enregistrer"}</button>${isNew?"":`<button class="btn danger" id="t-del">Supprimer</button>`}</div>`,()=>{
  const sync=()=>{t.cents=Math.abs(toCents($("t-amt").value||"0"))||0;t.merchant=$("t-m").value.trim();t.date=$("t-date").value;t.note=$("t-note").value.trim();if($("t-acc"))t.accountId=$("t-acc").value;if($("t-from"))t.fromId=$("t-from").value;if($("t-to"))t.toId=$("t-to").value;if($("t-goal"))t.goalId=$("t-goal").value;document.querySelectorAll(".s-cat").forEach(e=>splits[+e.dataset.si].cat=e.value);document.querySelectorAll(".s-amt").forEach(e=>splits[+e.dataset.si].cents=Math.abs(toCents(e.value||"0"))||0)};
  const showSum=()=>{const e=$("t-splitsum");if(!e)return;sync();const s=splits.reduce((a,x)=>a+x.cents,0);e.innerHTML=s===t.cents?`Répartition complète ✓`:`<span style="color:var(--bad)">Total réparti ${fmtC(s)} / ${fmtC(t.cents)}</span>`};showSum();
  $("layer").querySelectorAll(".s-amt,#t-amt").forEach(e=>e.addEventListener("input",showSum));
  [$("tk")].forEach(g=>g.onclick=e=>{const b=e.target.closest("button");if(!b)return;sync();t.kind=b.dataset.k;draw()});
  let a=t.cents?(t.cents/100).toFixed(2).replace(".",",").replace(/,00$/,""):"";const shw=()=>{$("t-amtd").innerHTML=a?esc(a)+" $":'<span style="color:var(--mute)">0 $</span>';$("t-amt").value=a.replace(",",".");$("t-amt").dispatchEvent(new Event("input"))};shw();
  $("t-kp").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;if(k==="⌫")a=a.slice(0,-1);else if(k===","){if(!a.includes(","))a=(a||"0")+","}else{const d=a.split(",")[1];if(d&&d.length>=2)return;if(a.replace(",","").length>=8)return;a=a==="0"?k:a+k}if(navigator.vibrate)navigator.vibrate(5);shw()};
  $("t-m").addEventListener("input",()=>{if($("t-m").value.trim().length>=3&&(!t.cat||t._auto)){const c=categorize($("t-m").value,cfg.learned);t.cat=c;t._auto=true;const ch=$("t-cats");ch&&ch.querySelectorAll(".cg").forEach(x=>x.classList.toggle("on",x.dataset.c===c))}});
  $("t-m").addEventListener("change",()=>{if(!t.cat||t._auto){const c=categorize($("t-m").value,cfg.learned);t.cat=c;t._auto=true;const ch=$("t-cats");ch&&ch.querySelectorAll(".cg").forEach(x=>x.classList.toggle("on",x.dataset.c===c))}});
  const ch=$("t-cats");ch&&(ch.onclick=e=>{const b=e.target.closest(".cg");if(!b)return;t.cat=b.dataset.c;t._auto=false;t._manual=true;if(navigator.vibrate)navigator.vibrate(8);ch.querySelectorAll(".cg").forEach(x=>x.classList.toggle("on",x===b))});
  const as=$("t-addsplit");as&&(as.onclick=()=>{sync();if(!splits.length)splits.push({cat:t.cat||cfg.cats[0].name,cents:t.cents});splits.push({cat:cfg.cats[0].name,cents:0});draw()});
  if(isNew&&!t.cents)setTimeout(()=>$("t-amt").focus(),250);
  $("t-save").onclick=async()=>{sync();if(!(t.cents>0))return toast("Entre un montant supérieur à 0");if(!t.date)return toast("Choisis une date");const isSp=t.kind==="achat"||t.kind==="rembours";
   if(isSp&&!t.cat)t.cat=categorize(t.merchant,cfg.learned);if(!t.merchant)t.merchant=isSp?t.cat:KINDS[t.kind];
   const sp2=splits.filter(s=>s.cents>0);if(isSp&&sp2.length>1){if(sp2.reduce((a,x)=>a+x.cents,0)!==t.cents)return toast("La répartition doit égaler le montant total");t.splits=sp2;t.cat=sp2[0].cat}else delete t.splits;
   if(!isSp){delete t.cat}if(t._manual&&t.merchant&&isSp){const k=merchantKey(t.merchant);if(k&&categorize(t.merchant,{})!==t.cat){cfg.learned[k]=t.cat;saveCfg()}}
   const prev=txs.find(x=>x.id===t.id);if(prev&&isSp&&prev.cat!==t.cat&&t.merchant){const k=merchantKey(t.merchant);if(k){cfg.learned[k]=t.cat;saveCfg()}}
   delete t._auto;delete t._manual;t.created=t.created||Date.now();try{await putTx(t);closeSheet();toast(isNew?`${fmtC(t.cents)} ajouté`:"Enregistré");afterChange()}catch(e){toast("Échec de l'enregistrement")}};
  const d=$("t-del");d&&(d.onclick=async()=>{if(!d.dataset.c){d.dataset.c=1;d.textContent="Toucher encore pour supprimer";return}await delTx(t.id);closeSheet();toast("Supprimé");afterChange()});

 if(view==="reports"){const st=monthStats(txs,S.month),c=cv("c-donut");if(c){const cats=Object.entries(st.byCat).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),tot=cats.reduce((s,x)=>s+x[1],0),cx=c.w/2,cy=c.h/2,r=Math.min(c.w,c.h)/2-6;let a=-Math.PI/2;cats.forEach(([n,v])=>{const da=v/tot*Math.PI*2;c.x.beginPath();c.x.arc(cx,cy,r,a,a+da);c.x.arc(cx,cy,r*.62,a+da,a,true);c.x.closePath();c.x.fillStyle=catColor(n);c.x.fill();a+=da});c.x.fillStyle=css("--fg");c.x.textAlign="center";c.x.font="700 20px -apple-system,system-ui";c.x.fillText(fmtC(tot),cx,cy+4);c.x.font="11px -apple-system,system-ui";c.x.fillStyle=css("--mute");c.x.fillText("dépenses nettes",cx,cy+22)}

 if(view==="goals"){const c=cv("c-proj");if(c){const today=TODAY(),avg=avgMonthlySavings(txs,today),start=cfg.goals.reduce((s,g)=>s+goalSaved(g,txs),0),pts=Array.from({length:13},(_,k)=>start+avg*k),tg=cfg.goals.reduce((s,g)=>s+g.targetCents,0),hi=Math.max(100,pts[12],tg),lo=Math.min(0,...pts),L=38,B=20,T=8,Y=axes(c.x,c.w,c.h,lo,hi*1.05,L,T,B),X=k=>L+k/12*(c.w-L-8);
  if(tg){c.x.setLineDash([4,4]);c.x.strokeStyle=css("--warn");c.x.beginPath();c.x.moveTo(L,Y(tg));c.x.lineTo(c.w,Y(tg));c.x.stroke();c.x.setLineDash([]);c.x.fillStyle=css("--warn");c.x.textAlign="left";c.x.fillText("Objectifs "+fmtC(tg),L+4,Y(tg)-5)}
  c.x.beginPath();pts.forEach((v,k)=>k?c.x.lineTo(X(k),Y(v)):c.x.moveTo(X(k),Y(v)));c.x.lineTo(X(12),Y(lo));c.x.lineTo(X(0),Y(lo));c.x.closePath();c.x.globalAlpha=.14;c.x.fillStyle=css("--save");c.x.fill();c.x.globalAlpha=1;c.x.beginPath();pts.forEach((v,k)=>k?c.x.lineTo(X(k),Y(v)):c.x.moveTo(X(k),Y(v)));c.x.strokeStyle=css("--save");c.x.lineWidth=2.5;c.x.stroke();
  [3,6,12].forEach(k=>{c.x.beginPath();c.x.arc(X(k),Y(pts[k]),3.5,0,7);c.x.fillStyle=css("--save");c.x.fill()});c.x.fillStyle=css("--mute");c.x.textAlign="center";[0,3,6,9,12].forEach(k=>c.x.fillText(new Date(today.getFullYear(),today.getMonth()+k,1).toLocaleDateString("fr-CA",{month:"short"}),X(k),c.h-5))}}
 if(view==="calendar"){const c=cv("c-cash");if(c){const sim=simulateCash(cfg,txs,TODAY(),60),v=sim.pts.map(p=>p.bal),cu=cfg.cushionCents,hi=Math.max(cu,...v)*1.08,lo=Math.min(0,cu,...v),L=38,B=20,T=8,Y=axes(c.x,c.w,c.h,lo,hi,L,T,B),X=i=>L+i/60*(c.w-L-8);c.x.setLineDash([4,4]);c.x.strokeStyle=css("--bad");c.x.beginPath();c.x.moveTo(L,Y(cu));c.x.lineTo(c.w,Y(cu));c.x.stroke();c.x.setLineDash([]);c.x.beginPath();v.forEach((b,i)=>i?c.x.lineTo(X(i),Y(b)):c.x.moveTo(X(i),Y(b)));c.x.strokeStyle=css("--accent");c.x.lineWidth=2.2;c.x.stroke();const li=v.indexOf(Math.min(...v));c.x.beginPath();c.x.arc(X(li),Y(v[li]),4,0,7);c.x.fillStyle=v[li]<cu?css("--bad"):css("--accent");c.x.fill();c.x.fillStyle=css("--mute");c.x.textAlign="center";[0,15,30,45,60].forEach(i=>c.x.fillText(fmtD(sim.pts[i].date).slice(0,5),X(i),c.h-5))}}

/* ---------- alerts after each change ---------- */
function smartAlerts(mk){const out=[],t=TODAY(),day=t.getDate(),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),st=monthStats(txs,mk);
 if(cfg.alertsOn.rise!==false&&day>=7){for(const c of cfg.cats){const hist=[1,2,3].map(k=>monthStats(txs,shiftMonth(mk,-k)).byCat[c.name]||0).filter(v=>v>0);if(hist.length<2)continue;const a=hist.reduce((x,y)=>x+y,0)/hist.length,proj=(st.byCat[c.name]||0)/day*dim;
  if(proj>a*1.25&&proj-a>3000)out.push({cat:c.name,level:"hausse",key:"h|"+c.name,msg:`${c.name} en hausse : environ ${fmtC(Math.round(proj/100)*100)} prévus ce mois-ci contre ${fmtC(Math.round(a/100)*100)} d'habitude (+${Math.round((proj/a-1)*100)} %).`})}}
 const an=anomalies(txs,mk);
 if(cfg.alertsOn.unusual!==false)an.unusual.forEach(x=>out.push({cat:x.cat,level:"inhabituel",key:"u|"+x.id,msg:`Dépense inhabituelle : ${x.merchant}, ${fmtC(x.cents)} en ${x.cat}, bien au-dessus de tes achats habituels.`}));
 if(cfg.alertsOn.dup!==false)an.dupes.forEach(([a,b])=>out.push({cat:b.cat||"",level:"doublon",key:"d|"+b.id,msg:`Doublon possible : ${b.merchant}, ${fmtC(b.cents)} le ${fmtD(b.date)}, apparaît deux fois.`}));
 return out.filter(o=>!cfg.alertsHist.some(h=>h.month===mk&&h.key===o.key))}
function checkAlerts(){const mk=todayIso().slice(0,7),now=Date.now();const b=budgetAlerts(monthStats(txs,mk),cfg.budgets,cfg.alertsOn,cfg.alertsHist,mk).map(f=>({month:mk,cat:f.cat,level:f.level,msg:`${f.cat} a atteint ${f.level} % du budget.`,at:now}));const sm=smartAlerts(mk).map(f=>({month:mk,...f,at:now}));const all=[...b,...sm];
 if(all.length){cfg.alertsHist.push(...all);saveCfg();toast("⚠︎ "+all[0].msg);if(navigator.vibrate)navigator.vibrate([20,60,20])}return all}
function afterChange(){checkAlerts();render()}

/* ---------- PIN lock ---------- */
async function hashPin(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mf-salt-"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function renderLock(){$("tabs").hidden=true;$("fab").hidden=true;$("app").innerHTML=`<div class="lock"><b style="font-size:20px">Mes Finances</b><div class="mini">Entre ton code</div><div class="pin-dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?"f":""}"></i>`).join("")}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}" aria-label="${k==="⌫"?"Effacer":k}">${k}</button>`).join("")}</div></div>`;
 $("app").querySelector(".keypad").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;if(k==="⌫")S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;if(S.pin.length===4){if(await hashPin(S.pin)===cfg.pinHash){locked=false;S.pin="";render();walletSync(false);return}S.pin="";toast("Code incorrect");if(navigator.vibrate)navigator.vibrate(120)}renderLock()}}

/* ---------- Wallet sync via Google Sheet ---------- */
function walletSync(manual){if(manual)go("wallet")}
async function importWallet(text,label){const items=parseWallet(text);if(!items.length)return toast("Aucun paiement Wallet trouvé dans ce fichier");
 const seen=new Set(txs.filter(t=>t.walletId).map(t=>t.walletId)),keys=new Set(txs.map(dupKey));const fresh=items.filter(i=>!seen.has(i.walletId));
 const list=fresh.map(i=>{const card=cfg.cards.find(c=>c.last4&&i.card.includes(c.last4))||cfg.cards.find(c=>i.card&&c.name&&i.card.toLowerCase().includes(c.name.toLowerCase().split(" ")[0]))||cfg.cards.find(c=>c.id===cfg.walletCard);return{kind:"achat",date:i.date,cents:i.cents,merchant:i.merchant,cat:categorize(i.merchant,cfg.learned),accountId:card?card.id:"",walletId:i.walletId,note:keys.has(dupKey(i))?"Doublon possible avec un relevé":"",created:Date.now()}});
 cfg.lastWallet=Date.now();saveCfg();if(!list.length){toast("Rien de nouveau : tous ces paiements sont déjà dans l'app");return render()}
 await putMany(list);toast(`${list.length} paiement${list.length>1?"s":""} Apple Pay ajouté${list.length>1?"s":""}`);afterChange()}
document.addEventListener("change",async e=>{if((e.target.id==="walletfile"||e.target.id==="walletfile2")&&e.target.files[0]){importWallet(await e.target.files[0].text());e.target.value=""}});
